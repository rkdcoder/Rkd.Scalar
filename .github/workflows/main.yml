name: Build, Test and Deploy Rkd.Scalar Package

on:
  push:
    branches:
      - master

    paths-ignore:
      - "**/*.md"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # Also runs package validation: the build fails if the public API
      # breaks compared with PackageValidationBaselineVersion.
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Rkd.Scalar/Rkd.Scalar.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/Rkd.Scalar.Abstractions/Rkd.Scalar.Abstractions.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/Rkd.Scalar.Errors/Rkd.Scalar.Errors.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/Rkd.Scalar.HttpLogging.Postgres/Rkd.Scalar.HttpLogging.Postgres.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/Rkd.Scalar.HttpLogging.SqlServer/Rkd.Scalar.HttpLogging.SqlServer.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/Rkd.Scalar.FluentValidation/Rkd.Scalar.FluentValidation.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*

  # A job of its own: only here the workflow can ask for an identity token, and pull requests never get this far.
  # Repository, workflow file and environment must match the trusted publishing policy on nuget.org.
  publish:
    needs: build-test-pack
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Exchanges the identity token for an API key that lasts one hour.
      - name: Log in to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: rkdcoder

      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
